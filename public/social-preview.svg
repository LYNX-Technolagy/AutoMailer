<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AutoMailer — Send to everyone. One at a time.">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#222222" stroke-width="1"/>

  <!-- Wordmark: dot + AutoMailer -->
  <circle cx="96" cy="112" r="9" fill="#EDEDED"/>
  <text x="120" y="120" fill="#EDEDED" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.5">AutoMailer</text>

  <!-- Eyebrow -->
  <text x="96" y="252" fill="#888888" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="3">INDIVIDUALIZED EMAIL</text>

  <!-- Headline -->
  <text x="96" y="330" fill="#EDEDED" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="800" letter-spacing="-3">Send to everyone.</text>
  <text x="96" y="410" fill="#888888" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="800" letter-spacing="-3">One at a time.</text>

  <!-- Sub -->
  <text x="96" y="480" fill="#888888" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">Upload a JSON array. Each recipient gets their own email.</text>

  <!-- Footer rule -->
  <line x1="96" y1="540" x2="1104" y2="540" stroke="#222222" stroke-width="1"/>
  <text x="96" y="568" fill="#666666" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="500" letter-spacing="1">NEVER CC · NEVER BCC · 50/24H</text>
</svg>